[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-data-pipeline"
version = "0.1.0"
description = "Reproducible ingest → clean → transform pipeline for Open-Meteo Toronto daily weather"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lrk777" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "pandera>=0.20",
  "pyarrow>=15.0",
  "duckdb>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: hits the Open-Meteo API (deselect with -m 'not network')",
]
